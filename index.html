<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#14262e;--mute:#5d707a;--line:#e4eaf0;--brand:#12327f;--bi:#fff;--gold:#e8a900;--red:#c2352b;--green:#1f8a54;--soft:#e9eefb;--sh:0 1px 2px rgba(20,38,46,.06),0 6px 18px rgba(20,38,46,.06);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0c1226;--card:#151d38;--ink:#e8f0f2;--mute:#8fa5ad;--line:#27325a;--brand:#8fb0ff;--bi:#0b1a3d;--gold:#f0b92a;--red:#ef6a5e;--green:#4cc88a;--soft:#1b2a55;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;gap:8px}
h1{font-size:20px;font-weight:800;margin:0;line-height:1.2}
h2{font-size:17px;font-weight:700;margin:22px 0 10px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card,.stat,.bar{background:var(--card);box-shadow:var(--sh);border-radius:18px}
.card{padding:16px;margin:10px 0}
.bar{padding:10px 14px;font-size:14px;margin:6px 0;border:1px solid var(--gold)}
.hero{background:var(--brand);color:var(--bi);border-radius:22px;padding:20px;margin:6px 0 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.hero b{font-size:36px;font-weight:800;line-height:1.1}.hero span{opacity:.85;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}.stat b{display:block;font-size:24px;font-weight:800}.stat.red b{color:var(--red)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--soft);color:var(--brand)}
.pill.Overdue{background:var(--red);color:#fff}.pill.Closed{background:var(--line);color:var(--mute)}.pill.Active{background:var(--green);color:#fff}.pill.sync{background:var(--gold);color:#241a00}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--brand)}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px;color:var(--mute)}
select,input{width:100%;height:54px;font:inherit;font-size:16px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input.big{height:72px;font-size:32px;font-weight:800;text-align:center}
.btn{width:100%;height:54px;margin-top:20px;border:0;background:var(--brand);color:var(--bi);font:inherit;font-weight:800;font-size:17px;border-radius:16px;cursor:pointer}
.btn.sm{width:auto;height:auto;margin:0;padding:8px 14px;font-size:14px;border-radius:10px;background:var(--soft);color:var(--brand)}
.btn.alt{background:var(--soft);color:var(--brand)}
.chips,.modes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips button,.modes button{flex:1;min-width:60px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--brand);font:inherit;font-weight:800;cursor:pointer}
.modes button{background:var(--card);color:var(--ink)}.modes button.on{background:var(--brand);color:var(--bi);border-color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{text-align:center;font-size:12px;color:var(--mute)}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:var(--card);color:var(--ink);font:inherit;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cal button.has{background:var(--soft);font-weight:700}.cal button.today{box-shadow:inset 0 0 0 2px var(--brand)}.cal button.sel{background:var(--brand);color:var(--bi)}
.cal button small{font-size:10px;font-weight:700}.cal button:disabled{visibility:hidden}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -4px 16px rgba(20,38,46,.08);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mute);font:inherit;font-weight:700;font-size:10px;padding:8px 0 10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--brand)}nav .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.6}nav button.on .ic{filter:none;opacity:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:5;max-width:90%}
.back{border:0;background:none;color:var(--brand);font:inherit;font-weight:700;padding:8px 0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.banner{display:block;width:100%;height:auto;border-radius:18px;margin:12px 0 4px;box-shadow:var(--sh)}
a{color:var(--brand);font-weight:700}
textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:9px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--bi)}
.proofs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.proof{background:var(--card);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.proof img{width:100%;height:120px;object-fit:cover;display:block;cursor:pointer}
.proof span{display:block;padding:8px 10px;font-size:13px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.ov img{max-width:100%;max-height:75vh;border-radius:8px}
.ch .t{fill:var(--mute);font-size:9px}.ch .g{stroke:var(--line);stroke-width:1}.ch .b{fill:var(--brand)}
.ds1{stroke:var(--green)}.ds2{stroke:var(--red)}.ds3{stroke:var(--mute)}
.hb{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin:10px 0;font-size:14px}
.hb .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--brand)}.hb b{font-size:13px}
.lg span{display:block;margin:5px 0;font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
#pr{display:none}
@media print{
@page{size:A4;margin:12mm}
html,body{background:#fff!important;color:#000!important;padding:0!important;margin:0!important}
.wrap,nav,.toast,.ov{display:none!important}
#pr{display:block;font:12px/1.4 system-ui,'Noto Sans Tamil','Latha',Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr .pban{display:block;max-height:38mm;width:auto;max-width:100%;margin:0 auto 5mm}
#pr .pt1{font-size:18px;margin:0 0 2px}
#pr .psub{color:#444;margin-bottom:6px}
#pr .ph2{font-size:14px;margin:14px 0 6px}
#pr table.pt{width:100%;border-collapse:collapse;margin-bottom:6px}
#pr .pt th,#pr .pt td{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top}
#pr .pt th{background:#dfe6f5;font-weight:700}
#pr .pt .r{text-align:right}#pr .pt .c{text-align:center}
#pr .pt thead{display:table-header-group}#pr .pt tr{page-break-inside:avoid}
#pr .pt tfoot td{font-weight:700;background:#eee}
#pr .pft{margin-top:10px;font-size:10px;color:#555}
}
.chk{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-weight:600;color:var(--ink);font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.toast{z-index:20}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="pr"></div>
<div id="pop"></div>
<div id="tst"></div>
<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,sendPasswordResetEmail,reauthenticateWithCredential,EmailAuthProvider,verifyBeforeUpdateEmail} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDoc,setDoc,updateDoc,onSnapshot,query,where,writeBatch,getDocs,deleteDoc,runTransaction} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyBNIR2oFEJrcvqcGCBibX6vWCKqIrjMxX0",authDomain:"collection-app-f5e97.firebaseapp.com",projectId:"collection-app-f5e97",storageBucket:"collection-app-f5e97.firebasestorage.app",messagingSenderId:"820066396874",appId:"1:820066396874:web:c09be2d040eaaa4455a233"};
const app=initializeApp(cfg),auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const $=id=>document.getElementById(id);
const inr=n=>'\u20b9'+Math.round(n).toLocaleString('en-IN');
const iso=d=>{const m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x};
let TODAY=iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const MODES=['Cash','UPI','Bank'];
const PTYPES=['Aadhaar','PAN','Address proof','Photo','Other'];
const BAN='<h1 class="sr">Vetri Murugan Finance</h1><img class="banner" src="banner.jpg" alt="Vetri Murugan Finance. Your growth, our commitment.">';
const IC={dash:'\ud83d\udcc5',cust:'\ud83d\udc65',loans:'\ud83d\udcd2',add:'\u2795',reports:'\ud83d\udcca',team:'\ud83e\uddd1\u200d\ud83d\udcbc',deleted:'\ud83d\uddd1\ufe0f'};
let ME=null,ERR='',READY=false,dirty=false,U=[],PU=null;
let DEL={customers:[],loans:[],payments:[]},DP=[];
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const IDLE=2*60*60*1000;let LAST=Date.now(),LOGIN=null,MIG=false,HOLD=0;
const LID=l=>l&&l.loanNo?'L-'+String(l.loanNo).padStart(4,'0'):'\u2014';
const lidOf=id=>LID(D.loans.find(x=>x.id===id)||DEL.loans.find(x=>x.id===id));
function idleOut(){ERR='You were logged out after 2 hours of inactivity. Please log in again.';LS.del('vmf_last');signOut(auth)}
function touch(ev){
  if(!ME)return;const n=Date.now();TODAY=iso(new Date());
  if(n-LAST>IDLE){if(ev&&ev.stopPropagation){ev.stopPropagation();ev.preventDefault&&ev.preventDefault()}idleOut();return}
  LAST=n;LS.set('vmf_last',String(n));
}
['pointerdown','click','keydown','touchstart'].forEach(e=>document.addEventListener(e,touch,{capture:true,passive:false}));
setInterval(()=>{if(ME&&Date.now()-LAST>IDLE)idleOut()},30000);
document.addEventListener('visibilitychange',()=>{if(ME&&!document.hidden&&Date.now()-LAST>IDLE)idleOut()});
async function migrateIds(){
  if(MIG||!own())return;
  const all=D.loans.concat(DEL.loans).filter(l=>!l.loanNo);
  if(!all.length)return;MIG=true;
  all.sort((a,b)=>(a.created||0)-(b.created||0)||(a.disbursal<b.disbursal?-1:1));
  try{await runTransaction(db,async tx=>{
    const cr=doc(db,'meta','loanCounter'),cs=await tx.get(cr);let n=cs.exists()?cs.data().n:0;
    all.forEach(l=>{n++;tx.update(doc(db,'loans',l.id),{loanNo:n})});
    tx.set(cr,{n});
  })}catch(e){console.error(e);setTimeout(()=>{MIG=false},60000)}
}
let D={users:[],customers:[],loans:[],payments:[],proofs:[]};
let UI={tab:'dash',month:TODAY.slice(0,7),sel:TODAY,cust:null,sub:'loan',edit:false,view:null,pm:null,shown:null,fp:false,af:'all',sc:[],at:'',rs:null,rep:'sum',ir:'d',rd:TODAY,rw:TODAY,rc:null,filter:'All',pick:'',mode:'Cash',toast:''};

const own=()=>ME&&ME.role==='owner';
const spec=()=>ME&&ME.role==='spectator';
const cust=id=>D.customers.find(c=>c.id===id)||DEL.customers.find(c=>c.id===id)||{name:'?',phone:''};
const nm=id=>(D.users.find(u=>u.id===id)||{}).name||(ME&&id===ME.uid?ME.name:'Staff');
const lp=l=>D.payments.filter(p=>p.lid===l.id);
const paid=l=>lp(l).reduce((s,p)=>s+p.amount,0);
const due=l=>addDays(l.disbursal,100);
const status=l=>l.amount-paid(l)<=0?'Closed':TODAY>due(l)?'Overdue':'Active';
const lastPay=l=>lp(l).reduce((m,p)=>p.date>m?p.date:m,l.disbursal);
const openLoan=cid=>D.loans.find(l=>l.cid===cid&&status(l)!=='Closed');
const emps=()=>D.users.filter(u=>u.role==='employee');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((s,p)=>s+p.amount,0);

function showToast(m){const t=$('tst');if(!t)return;t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(showToast.t);showToast.t=setTimeout(()=>{t.innerHTML=''},2600)}
function flash(m){showToast(m);render()}
function warn(m){showToast(m)}
function R(){if(Date.now()<HOLD)return;const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&$('app').contains(a)){dirty=true;return}render()}
$('app').addEventListener('focusout',()=>{if(dirty){dirty=false;setTimeout(render,400)}});
window.addEventListener('online',render);window.addEventListener('offline',render);

/* ---------- auth + data ---------- */
onAuthStateChanged(auth,async u=>{
  U.forEach(f=>f());U=[];ME=null;if(PU){PU();PU=null}DEL={customers:[],loans:[],payments:[]};DP=[];D={users:[],customers:[],loans:[],payments:[],proofs:[]};
  if(u){
    try{
      {const last=+LS.get('vmf_last')||0;if(last&&Date.now()-last>IDLE){ERR='You were logged out after 2 hours of inactivity. Please log in again.';LS.del('vmf_last');await signOut(auth);return}}
      let s=await getDoc(doc(db,'users',u.uid));
      if(!s.exists()){
        const b=writeBatch(db);
        b.set(doc(db,'users',u.uid),{name:'Owner',phone:(u.email||'').split('@')[0],role:'owner',active:true});
        b.set(doc(db,'meta','setup'),{owner:u.uid});
        await b.commit();s=await getDoc(doc(db,'users',u.uid));
      }
      const d=s.data();
      if(d.active===false){ERR='This account is disabled. Ask the owner.';await signOut(auth)}
      else{ME={uid:u.uid,...d};if((ME.role!=='owner'&&['team','deleted'].includes(UI.tab))||(ME.role==='employee'&&UI.tab==='reports')||(ME.role==='spectator'&&UI.tab==='add'))UI.tab='dash';LAST=Date.now();LS.set('vmf_last',String(LAST));if(LOGIN){if(ME.role==='owner'&&LOGIN.remember)LS.set('vmf_user',LOGIN.v);else LS.del('vmf_user');LOGIN=null}sub()}
    }catch(e){ERR='Your account is not set up yet. Ask the owner.';await signOut(auth)}
  }
  READY=true;render();
});
function sub(){
  const o=own()||spec(),ow=own(),w=(n,f)=>o?collection(db,n):query(collection(db,n),where(f,'==',ME.uid));
  const L=(n,f)=>U.push(onSnapshot(w(n,f==='lemp'?'lemp':'emp'),{includeMetadataChanges:true},s=>{const a=s.docs.map(d=>({id:d.id,...d.data(),_p:d.metadata.hasPendingWrites}));D[n]=a.filter(x=>!x.deleted);if(ow)DEL[n]=a.filter(x=>x.deleted);if(ow&&n==='loans')migrateIds();R()},e=>console.error(e)));
  L('customers','emp');L('loans','emp');L('payments','lemp');
  if(o)U.push(onSnapshot(collection(db,'users'),s=>{D.users=s.docs.map(d=>({id:d.id,...d.data()}));R()}));
  if(ow)U.push(onSnapshot(query(collection(db,'proofs'),where('deleted','==',true)),s=>{DP=s.docs.map(d=>({id:d.id,...d.data()}));R()},e=>console.error(e)));
  U.push(onSnapshot(doc(db,'users',ME.uid),s=>{const d=s.data();if(!d)return;if(d.active===false){ERR='This account has been disabled.';signOut(auth);return}ME={uid:ME.uid,...d};R()}));
}

/* ---------- actions ---------- */
const H=window.H={
  async login(){const p=$('ph').value.trim(),n=$('pin').value.trim();ERR='';LOGIN={v:p,remember:!!$('rm').checked};
    try{await signInWithEmailAndPassword(auth,p.includes('@')?p:p+'@collections.app',n)}catch(e){ERR='Phone number or PIN is wrong.';render()}},
  out(){LS.del('vmf_last');signOut(auth)},
  tab(t){UI.tab=t;UI.cust=null;UI.rc=null;subProofs(null);render()},
  set(k,v){UI[k]=v;render()},
  c(id){UI.cust=id;UI.sub='loan';UI.edit=false;subProofs(id);render()},
  month(n){const p=UI.month.split('-'),d=new Date(+p[0],+p[1]-1+n,1);UI.month=iso(d).slice(0,7);render()},
  amt(n){$('amt').value=n},
  pay(){
    const l=D.loans.find(x=>x.id===UI.pick),a=parseFloat($('amt').value);
    if(!l)return warn('Select a customer first');
    if(!(a>0))return warn('Enter an amount above 0');
    const bal=l.amount-paid(l),today=iso(new Date());
    if(a>bal)return warn('Amount is more than the balance ('+inr(bal)+')');
    const dt=own()?(($('pdt')&&$('pdt').value)||today):today;
    if(dt>today)return warn('The payment date cannot be in the future');
    if(dt<l.disbursal)return warn('The payment date is before the loan was given ('+fmtD(l.disbursal)+')');
    const mode=UI.mode;
    const go=()=>{
      const n=new Date(),t=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2),td=iso(n);
      setDoc(doc(collection(db,'payments')),{lid:l.id,cid:l.cid,lemp:l.emp,emp:ME.uid,date:dt,entered:td,dnum:+dt.replace(/-/g,''),time:t,amount:a,mode,ts:Date.now()}).catch(()=>flash('Could not save this payment'));
      UI.pick='';UI.pd='';
      flash(dt!==td?'Back-dated payment saved for '+fmtD(dt):a>=bal?'Saved. Loan closed':(navigator.onLine?'Payment saved':'Saved offline. Will sync later'));
    };
    if(dt!==today)return popup('Back-dated entry','You are saving a payment dated <b>'+fmtD(dt)+'</b>, not today (<b>'+fmtD(today)+'</b>).<br>It will be marked as back-dated in the records.','Yes, save back-dated payment',go);
    go();
  },
  popYes(){const f=PEND;PEND=null;HOLD=0;$('pop').innerHTML='';if(f)f()},
  popNo(){PEND=null;HOLD=0;$('pop').innerHTML=''},
  pdate(v){UI.pd=v||'';const w=$('bdw');if(w)w.innerHTML=bdMsg(UI.pd||iso(new Date()))},
  async newLoan(){
    const sel=$('nlc').value,name=$('nln').value.trim(),ph=$('nlp').value.replace(/\D/g,''),addr=$('nlad').value.trim();
    const a=parseFloat($('nla').value),g=parseFloat($('nlg').value),today=iso(new Date());
    const dt=own()?($('nld').value||''):today;
    let emp=$('nle').value;
    if(sel){if(openLoan(sel))return warn('This customer already has an open loan');emp=cust(sel).emp}
    else{
      if(name.length<2)return warn('Enter the customer name');
      if(!/^\d{10}$/.test(ph))return warn('Enter a 10-digit phone number');
      if(addr.length<5)return warn('Enter the full address');
      if(!emp)return warn('Choose the collector');
    }
    if(!(a>0)||!(g>0))return warn('Enter loan amount and amount in hand');
    if(g>a)return warn('Amount in hand cannot be more than the loan amount');
    if(!dt)return warn('Choose the disbursal date');
    if(dt>today)return warn('The disbursal date cannot be in the future');
    let proof=null;
    if(!sel){
      const f=$('nlf').files&&$('nlf').files[0];
      if(!f)return warn('Upload at least one proof document (a photo of Aadhaar, PAN or address proof)');
      try{proof={type:$('nlt').value,data:await shrink(f)}}catch(e){return warn('Could not read the proof photo')}
      if(proof.data.length>900000)return warn('The proof photo is too large. Try a smaller photo');
    }

const fmtK=v=>v>=100000?(v/100000).toFixed(v>=1000000?0:1)+'L':v>=1000?Math.round(v/1000)+'k':String(Math.round(v));
function barSVG(vals,labs,every,label){
  const W=340,H=160,pl=34,pb=20,pt=10,n=vals.length,mx=Math.max(1,...vals),bw=(W-pl-4)/n,ph=H-pb-pt;
  let g='';[0,.5,1].forEach(f=>{const y=H-pb-ph*f;g+=`<line class="g" x1="${pl}" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="t" x="${pl-4}" y="${(y+3).toFixed(1)}" text-anchor="end">${fmtK(mx*f)}</text>`});
  const bars=vals.map((v,i)=>{const h=ph*v/mx;return `<rect class="b" x="${(pl+i*bw+1).toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`}).join('');
  const xl=labs.map((l,i)=>i%every===0?`<text class="t" x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${l}</text>`:'').join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">${g}${bars}${xl}</svg>`;

function donut(parts){
  const tot=parts.reduce((s,p)=>s+p.v,0)||1,C=2*Math.PI*40;let off=0;
  const seg=parts.filter(p=>p.v>0).map(p=>{const len=C*p.v/tot,el=`<circle class="${p.cls}" cx="60" cy="60" r="40" fill="none" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len;return el}).join('');
  return `<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Loan status split">${seg||'<circle cx="60" cy="60" r="40" fill="none" stroke="var(--line)" stroke-width="18"/>'}</svg>`;
}

}
function loginView(){return `${BAN}<div class="card"><h2 style="margin-top:0">Log in</h2>${ERR?`<div class="bar" role="alert">${esc(ERR)}</div>`:''}<label for="ph" style="margin-top:0">Phone number (owner can use email)</label><input id="ph" inputmode="email" autocomplete="username" value="${esc(LS.get('vmf_user')||'')}"><label for="pin">PIN (6 digits)</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')H.login()"><label class="chk"><input type="checkbox" id="rm"${LS.get('vmf_user')?' checked':''}> Remember me (owner only)</label><button class="btn" onclick="H.login()">Log in</button><div style="text-align:center;margin-top:14px"><a href="#" onclick="H.forgot();return false">Forgot password? (owner only)</a></div></div>`}

function head(){
  const pc=D.payments.filter(p=>p._p).length;
  return `${BAN}<header><div><b>${esc(ME.name)}</b> <span class="mute">\u00b7 ${ME.role==='owner'?'Owner':ME.role==='spectator'?'View only':'Employee'}</span></div><button class="btn sm" onclick="H.out()">Log out</button></header>`
   +(!navigator.onLine?`<div class="bar">You are offline. Payments are saved on this phone and sync later.</div>`:'')
   +(pc?`<div class="bar">${pc} payment${pc>1?'s':''} pending sync</div>`:'');
}

function dash(){
  const od=D.loans.filter(l=>status(l)==='Overdue'),soon=D.loans.filter(l=>{const d=diff(due(l),TODAY);return status(l)==='Active'&&d>=0&&d<=7});
  const tp=D.payments.filter(p=>p.date===TODAY);
  const [y,m]=UI.month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();
  const by={};D.payments.forEach(p=>(by[p.date]=by[p.date]||[]).push(p));
  let cells=['S','M','T','W','T','F','S'].map(d=>`<div class="h">${d}</div>`).join('')+'<button disabled></button>'.repeat(first);
  for(let d=1;d<=dim;d++){const ds=UI.month+'-'+(d<10?'0':'')+d,e=by[ds];
    cells+=`<button class="${e?'has ':''}${ds===TODAY?'today ':''}${ds===UI.sel?'sel':''}" onclick="H.set('sel','${ds}')">${d}${e?`<small>${e.length}</small>`:''}</button>`}
  const day=(by[UI.sel]||[]).slice().sort((a,b)=>a.time<b.time?-1:1);
  const list=day.map(p=>`<div class="card row"><div><b>${esc(cust(p.cid).name)}</b><div class="mute">${p.time} \u00b7 ${p.mode} \u00b7 ${esc(nm(p.emp))}${p._p?' <span class="pill sync">Pending sync</span>':''}${rcLabel(p)?'<br>'+esc(rcLabel(p)):''}${bdLabel(p)?'<br><b style="color:var(--red)">'+esc(bdLabel(p))+'</b>':''}</div></div><b>${inr(p.amount)}</b></div>`).join('');
  const mn=new Date(y,m-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});
  return `<div class="hero"><span>Collected today</span><b>${inr(sum(tp))}</b><span>${tp.length} ${tp.length===1?'entry':'entries'}</span></div>
  <div class="stats"><div class="stat red"><b>${od.length}</b><span class="mute">Overdue loans</span></div><div class="stat"><b>${soon.length}</b><span class="mute">Due in 7 days</span></div></div>${(own()||spec())?'<button class="btn alt" style="margin-top:12px" onclick="H.ins()">View overall insights (graphs)</button>':''}
  <h2 class="row"><button class="back" onclick="H.month(-1)">\u2039 Prev</button><span>${mn}</span><button class="back" onclick="H.month(1)">Next \u203a</button></h2>
  <div class="cal">${cells}</div>
  <h2>${new Date(UI.sel+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}: ${day.length} ${day.length===1?'entry':'entries'}, ${inr(sum(day))}</h2>
  ${list||'<div class="card mute">No collections on this date.</div>'}`;
}

function newLoanView(){
  const eo=(own()?[{id:ME.uid,name:'Me (Owner)'}].concat(emps().filter(u=>u.active!==false)):[{id:ME.uid,name:ME.name}]).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('');
  const co=D.customers.filter(c=>!openLoan(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  return `<button class="back" onclick="H.c(null)">\u2039 Back</button><h2 style="margin-top:0">New customer / loan</h2><div class="mute">For a new customer every field marked * is required, including one proof document.</div>
  <label for="nlc" style="margin-top:0">Existing customer (for a repeat loan)</label><select id="nlc"><option value="">New customer</option>${co}</select>
  <label for="nln">Name * (new customer)</label><input id="nln"><label for="nlp">Phone * (10 digits, new customer)</label><input id="nlp" type="tel" inputmode="numeric"><label for="nlad">Address * (new customer)</label><textarea id="nlad" rows="2"></textarea><label for="nlt">Proof document type * (new customer)</label><select id="nlt">${PTYPES.map(t=>`<option>${t}</option>`).join('')}</select><label for="nlf">Photo of the proof * (at least one is required)</label><input id="nlf" type="file" accept="image/*" style="height:auto;padding:12px">
  <label for="nle">Collector * (new customer)</label><select id="nle">${eo}</select>
  <label for="nla">Loan amount to repay (\u20b9) *</label><input id="nla" type="number" inputmode="numeric">
  <label for="nlg">Amount given in hand (\u20b9) *</label><input id="nlg" type="number" inputmode="numeric">
  ${own()?`<label for="nld">Disbursal date * (owner can change)</label><input id="nld" type="date" max="${iso(new Date())}" value="${iso(new Date())}"><div class="mute" style="margin-top:6px">If you pick a past date, you will be asked to confirm.</div>`:`<div class="mute" style="margin-top:14px">Disbursal date: today (${fmtD(iso(new Date()))}). Employees can only record loans for today.</div>`}
  <div class="mute" style="margin-top:10px">Due date is set automatically: disbursal date + 100 days.</div>
  <button class="btn" onclick="H.newLoan()">Save loan</button>`;
}

function custTab(){
  if(UI.cust==='new'&&(own()||ME.canAdd))return newLoanView();
  if(UI.cust){
    const c=D.customers.find(x=>x.id===UI.cust);if(!c){UI.cust=null;return custTab()}
    const l=openLoan(c.id);
    let o=`<button class="back" onclick="H.c(null)">\u2039 All customers</button><h2 style="margin-top:0">${esc(c.name)}</h2><div class="mute">${esc(c.phone)} \u00b7 Collector: ${esc(nm(c.emp))}</div>`;
    o+=SEG();if(UI.sub==='details')return o+detailsView(c);
    if(!l)return o+'<div class="card mute">No active loan. See the Loans tab for history.</div>';
    const pd=paid(l),dl=diff(due(l),TODAY);
    o+=`<div class="card"><div class="row"><b>Loan ${LID(l)}</b><span class="pill ${status(l)}">${status(l)}</span></div><div class="stats" style="margin-top:10px"><div><span class="mute">Loan amount</span><br><b>${inr(l.amount)}</b></div><div><span class="mute">Given in hand</span><br><b>${inr(l.given)}</b></div><div><span class="mute">Repaid</span><br><b>${inr(pd)}</b></div><div><span class="mute">Balance</span><br><b>${inr(l.amount-pd)}</b></div></div><div class="prog"><i style="width:${Math.min(100,pd/l.amount*100)}%"></i></div><div class="mute" style="margin-top:8px">Disbursed ${l.disbursal}${bdl(l)?' <b style="color:var(--red)">('+esc(bdl(l))+')</b>':''} \u00b7 Due ${due(l)} (${dl>=0?dl+' days left':-dl+' days overdue'})</div></div>`;
    const rows=lp(l).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.time<b.time?1:-1)).map(p=>`<tr><td>${p.date}${bdLabel(p)?`<div class="mute" style="color:var(--red)">${esc(bdLabel(p))}</div>`:''}</td><td>${p.time}</td><td>${p.mode}</td><td>${esc(nm(p.emp))}</td><td><b>${inr(p.amount)}</b>${p._p?' <span class="pill sync">Pending</span>':''}</td><td>${spec()?'':`<a href="${recLink(p,l)}" target="_blank" rel="noopener">Receipt</a>`}${rcLabel(p)?`<div class="mute">${esc(rcLabel(p))}</div>`:''}</td>${own()?`<td><button class="btn sm" style="color:var(--red)" onclick="H.delPay('${p.id}')">Delete</button></td>`:''}</tr>`).join('');
    return o+`<h2>Payment history</h2><div class="card tbl"><table><tr><th>Date</th><th>Time</th><th>Mode</th><th>By</th><th>Amount</th><th></th>${own()?'<th></th>':''}</tr>${rows}</table></div>`;
  }
  const items=D.customers.slice().sort((a,b)=>a.name<b.name?-1:1).map(c=>{
    const l=openLoan(c.id);
    if(!l)return `<div class="card row" style="cursor:pointer" onclick="H.c('${c.id}')"><b>${esc(c.name)}</b><span class="pill Closed">No active loan</span></div>`;
    const st=status(l),pd=paid(l),idle=diff(TODAY,lastPay(l));
    return `<div class="card" style="cursor:pointer" onclick="H.c('${c.id}')"><div class="row"><b>${esc(c.name)}</b><span class="pill ${st}">${st}</span></div><div class="row mute"><span>Balance ${inr(l.amount-pd)} of ${inr(l.amount)}</span><span>${idle>=7?'No payment in '+idle+' days':'Last paid '+lastPay(l)}</span></div><div class="prog"><i style="width:${Math.min(100,pd/l.amount*100)}%;${st==='Overdue'?'background:var(--red)':''}"></i></div></div>`}).join('');
  return `<div class="row"><h2 style="margin:0">Customers</h2>${(own()||ME.canAdd)?`<button class="btn sm" onclick="H.c('new')">+ New</button>`:''}</div>${items||'<div class="card mute">No customers yet.'+(own()?' Tap + New to add the first one.':'')+'</div>'}`;
}

function loansTab(){
  const f=UI.filter,opts=['All','Active','Overdue','Closed'].map(s=>`<option${s===f?' selected':''}>${s}</option>`).join('');
  const rows=D.loans.filter(l=>f==='All'||status(l)===f).sort((a,b)=>a.disbursal<b.disbursal?1:-1).map(l=>{
    const st=status(l);let note='';
    if(st==='Closed'){const cd=lastPay(l);note=diff(cd,l.disbursal)+' days, '+(cd<=due(l)?'on time':'late')}
    return `<tr><td>${LID(l)}</td><td>${esc(cust(l.cid).name)}</td><td>${l.disbursal}${bdl(l)?`<div class="mute" style="color:var(--red)">${esc(bdl(l))}</div>`:''}</td><td>${inr(l.amount)}</td><td>${inr(l.given)}</td><td>${inr(l.amount-l.given)}</td><td>${inr(paid(l))}</td><td><span class="pill ${st}">${st}</span></td><td>${note}</td></tr>`}).join('');
  return `<h2 style="margin-top:0">Loan history</h2><label for="f" style="margin-top:0">Status</label><select id="f" onchange="H.set('filter',this.value)">${opts}</select><div class="card tbl" style="margin-top:10px"><table><tr><th>Loan ID</th><th>Customer</th><th>Disbursed</th><th>Loan</th><th>In hand</th><th>Interest</th><th>Repaid</th><th>Status</th><th>Closed</th></tr>${rows}</table></div>`;
}

function addTab(){
  const open=D.loans.filter(l=>status(l)!=='Closed').sort((a,b)=>cust(a.cid).name<cust(b.cid).name?-1:1);
  const opts='<option value="">Select customer</option>'+open.map(l=>`<option value="${l.id}"${UI.pick===l.id?' selected':''}>${esc(cust(l.cid).name)} (${LID(l)})</option>`).join('');
  const l=open.find(x=>x.id===UI.pick);
  return `<h2 style="margin-top:0">Add payment</h2>${UI.rc?rcCard():''}<label for="cs" style="margin-top:0">Customer</label><select id="cs" onchange="H.set('pick',this.value)">${opts}</select>
  ${l?`<div class="bar" style="border-color:var(--line)"><div class="row"><span>Balance</span><b>${inr(l.amount-paid(l))}</b></div></div>`:''}
  ${own()?`<label for="pdt">Payment date (owner can change)</label><input id="pdt" type="date" max="${iso(new Date())}" value="${UI.pd||iso(new Date())}" onchange="H.pdate(this.value)"><div id="bdw">${bdMsg(UI.pd||iso(new Date()))}</div>`:`<div class="mute" style="margin-top:12px">Date: today (${fmtD(iso(new Date()))}). Employees can only add payments for today.</div>`}<label for="amt">Amount collected (\u20b9)</label><input id="amt" class="big" type="number" inputmode="numeric" min="1" placeholder="0">
  <div class="chips">${[100,200,300,500,1000].map(n=>`<button onclick="H.amt(${n})">${n}</button>`).join('')}</div>
  <label>Mode of payment</label><div class="modes">${MODES.map(m=>`<button class="${UI.mode===m?'on':''}" onclick="H.set('mode','${m}')">${m}</button>`).join('')}</div>
  <div class="mute" style="margin-top:12px">Saved with today's date, the current time and your ID.${navigator.onLine?'':' You are offline, so it will sync later.'}</div>
  <button class="btn" onclick="H.pay()">Save payment</button>`;
}

function repSummary(){
  const ls=D.loans,lent=ls.reduce((s,l)=>s+l.given,0),tc=ls.reduce((s,l)=>s+l.amount,0);
  const pend=ls.filter(l=>status(l)!=='Closed').reduce((s,l)=>s+l.amount-paid(l),0);
  const ids=(own()?[ME.uid]:[]).concat(emps().map(u=>u.id));
  const er=ids.map(id=>{const a=D.payments.filter(p=>p.emp===id),t=a.filter(p=>p.date===TODAY);return `<tr><td>${esc(nm(id))}</td><td>${t.length}</td><td>${inr(sum(t))}</td><td>${inr(sum(a))}</td></tr>`}).join('');
  const mr=MODES.map(m=>`<tr><td>${m}</td><td>${inr(sum(D.payments.filter(p=>p.mode===m)))}</td></tr>`).join('');
  const or=ls.filter(l=>status(l)==='Overdue').map(l=>`<tr><td>${esc(cust(l.cid).name)}</td><td>${inr(l.amount-paid(l))}</td><td>${diff(TODAY,due(l))} days</td></tr>`).join('');
  return `<div class="stats"><div class="stat"><b>${inr(lent)}</b><span class="mute">Cash lent out</span></div><div class="stat"><b>${inr(tc)}</b><span class="mute">Total to collect</span></div><div class="stat"><b>${inr(tc-lent)}</b><span class="mute">Interest earned</span></div><div class="stat"><b>${inr(sum(D.payments))}</b><span class="mute">Collected so far</span></div><div class="stat red"><b>${inr(pend)}</b><span class="mute">Pending on open loans</span></div></div>
  <h2>By collector</h2><div class="card tbl"><table><tr><th>Name</th><th>Today</th><th>Today \u20b9</th><th>All time</th></tr>${er}</table></div>
  <h2>By mode</h2><div class="card tbl"><table><tr><th>Mode</th><th>Collected</th></tr>${mr}</table></div>
  <h2>Overdue</h2><div class="card tbl"><table><tr><th>Customer</th><th>Balance</th><th>Overdue by</th></tr>${or||'<tr><td colspan="3" class="mute">None</td></tr>'}</table></div>
  ${own()?`<button class="btn" onclick="H.pdf('sum')">Download summary report (PDF)</button><button class="btn alt" style="margin-top:10px" onclick="H.csv()">Download all payments (CSV)</button>`:''}`;
}

function team(){
  const E=emps(),list=E.map(u=>{const off=u.active===false,n=D.customers.filter(c=>c.emp===u.id).length;
    return `<div class="card"><div class="row"><b>${esc(u.name)}</b><span class="pill ${off?'Closed':'Active'}">${off?'Disabled':'Active'}</span></div><div class="mute">${esc(u.phone)} \u00b7 ${n} customers</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="H.toggle('${u.id}',${!off})">${off?'Enable':'Disable'}</button><button class="btn sm" onclick="H.perm('${u.id}',${u.canAdd===true})">Add customers: ${u.canAdd?'ON':'OFF'}</button><button class="btn sm" onclick="H.set('pm','${u.id}')">Show PIN</button></div>${UI.shown&&UI.shown.id===u.id?`<div class="bar" style="margin-top:10px">PIN: <b>${UI.shown.pin?esc(UI.shown.pin):'not stored (added before this update)'}</b> <span class="mute">hides in 30 seconds</span></div>`:''}</div>`}).join('');
  const opt=sel=>[{id:ME.uid,name:'Me (Owner)'}].concat(E.filter(u=>u.active!==false||u.id===sel)).map(u=>`<option value="${u.id}"${u.id===sel?' selected':''}>${esc(u.name)}</option>`).join('');
  const asg=D.customers.map(c=>`<div class="row" style="margin:8px 0"><span>${esc(c.name)}</span><select style="width:auto;height:44px" aria-label="Collector for ${esc(c.name)}" onchange="H.assign('${c.id}',this.value)">${opt(c.emp)}</select></div>`).join('');
  return `${ownerCard()}<h2>Team</h2>${list||'<div class="card mute">No employees yet.</div>'}${specList()}
  <h2>Add employee</h2><div class="card"><label for="en" style="margin-top:0">Name</label><input id="en"><label for="ep">Phone number (10 digits)</label><input id="ep" type="tel" inputmode="numeric"><label for="epin">PIN (6 digits)</label><input id="epin" inputmode="numeric" maxlength="6"><label for="er">Account type</label><select id="er"><option value="employee">Employee (collects payments)</option><option value="spectator">Spectator (view only)</option></select><button class="btn" onclick="H.addEmp()">Add employee</button></div>
  <h2>Assign customers</h2>${assignCard(E)}`;
}

function render(){
  const A=$('app');
  if(!READY){A.innerHTML='<div class="card mute" style="margin-top:40px">Loading\u2026</div>';return}
  if(!ME){A.innerHTML=loginView()+fpModal();return}
  let tabs=[['dash','Dashboard'],['cust','Customers'],['loans','Loans'],['add','Add'],['reports','Reports'],['team','Team'],['deleted','Deleted']];
  if(spec())tabs=tabs.filter(t=>['dash','cust','loans','reports'].includes(t[0]));else if(!own())tabs=tabs.filter(t=>!['reports','team','deleted'].includes(t[0]));
  const body={dash,cust:custTab,loans:loansTab,add:addTab,reports,team,deleted:deletedTab}[UI.tab]();
  A.innerHTML=head()+body+'<nav>'+tabs.map(t=>`<button class="${UI.tab===t[0]?'on':''}" onclick="H.tab('${t[0]}')"><span class="ic">${IC[t[0]]}</span>${t[1]}</button>`).join('')+'</nav>'+viewer()+pinModal()+receiptGate();
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
