<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Maintenance room</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#14262e;--mute:#5d707a;--line:#e4eaf0;--navy:#12307f;--red:#c62828;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0c1226;--card:#151d38;--ink:#e8f0f2;--mute:#8fa5ad;--line:#27325a;--navy:#5b7fe0;--red:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 14px calc(90px + env(safe-area-inset-bottom,0px))}
.w{max-width:560px;margin:0 auto;padding-top:18px}
.c{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(20,38,46,.06),0 6px 18px rgba(20,38,46,.06);padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}.m{color:var(--mute);font-size:13px}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:20px;letter-spacing:6px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:12px 0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--navy);color:#fff;cursor:pointer}
button.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}button.r{background:var(--red);color:#fff}button:disabled{opacity:.4}
.full{width:100%}.err{color:var(--red);font-size:13px;min-height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{padding:7px 12px;border-radius:99px;font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.row input{width:20px;height:20px;margin-top:2px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar>*{flex:1;max-width:260px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.hide{display:none!important}
</style></head><body>
<div class="w">
<div id="login" class="c"><h1>Maintenance room</h1><div class="m">Sign in with an OTP sent to the master device: <b id="mk"></b></div>
<div id="s1"><button class="full" id="send" style="margin-top:14px">Send OTP</button></div>
<div id="s2" class="hide"><input id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"><button class="full" id="ver">Verify and enter</button></div>
<div class="err" id="le"></div><div id="rc"></div></div>
<div id="room" class="hide"><div class="c"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Deleted entries</h1><div class="m">Only entries already deleted in the app appear here.</div></div><button class="g" id="out">Log out</button></div><div class="chips" id="chips"></div><div class="m" id="cnt"></div><div id="list"></div></div></div>
</div>
<div class="bar hide" id="bar"><button class="g" id="all">Select all</button><button class="g" id="none">Clear</button><button class="r" id="del" disabled>Delete permanently</button></div>
<div class="ov hide" id="cf"><div class="c" style="max-width:380px;width:100%;margin:0"><h1 style="color:var(--red)">Delete permanently?</h1><div class="m" id="cm"></div><input id="ct" type="text" placeholder="DELETE" style="letter-spacing:3px;font-size:17px"><div style="display:flex;gap:8px"><button class="g full" id="cn">Cancel</button><button class="r full" id="cy" disabled>Delete</button></div><div class="err" id="ce"></div></div></div>
<script type="module">
/*FB*/
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,getDoc,doc,writeBatch} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const CFG={apiKey:"AIzaSyBNIR2oFEJrcvqcGCBibX6vWCKqIrjMxX0",authDomain:"collection-app-f5e97.firebaseapp.com",projectId:"collection-app-f5e97",storageBucket:"collection-app-f5e97.firebasestorage.app",messagingSenderId:"820066396874",appId:"1:820066396874:web:c09be2d040eaaa4455a233"};
const MASTER='+91XXXXXXXXXX'; // <-- the master device's mobile number, with country code
const app=initializeApp(CFG,'maint'),auth=getAuth(app),db=getFirestore(app);
let conf=null,ver=null;
const sendOtp=async()=>{ver=ver||new RecaptchaVerifier(auth,'rc',{size:'invisible'});conf=await signInWithPhoneNumber(auth,MASTER,ver)};
const verifyOtp=async c=>{await conf.confirm(c);try{await getDoc(doc(db,'meta','master'))}catch(e){await signOut(auth);throw {code:'not-master'}}};
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const fetchAll=async()=>{const q=n=>getDocs(query(collection(db,n),where('deleted','==',true)));
  const [c,l,p,x]=await Promise.all([getDocs(collection(db,'customers')),getDocs(collection(db,'loans')),q('payments'),q('proofs')]);
  return {customers:rows(c),loans:rows(l),payments:rows(p),proofs:rows(x)}};
const purge=async items=>{const ops=[];items.forEach(i=>{ops.push(doc(db,i.col,i.id));if(i.col==='loans'&&i.qk)ops.push(doc(db,'shares',i.qk))});
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}};
const logout=()=>signOut(auth).catch(()=>{});
/*FBEND*/
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'\u20b9'+Math.round(n||0).toLocaleString('en-IN');
const LID=n=>'L-'+String(n).padStart(4,'0');
const fd=t=>t?new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
let ALL=null,SEL=new Set(),FLT='all',idle=0,IT=[];
$('mk').textContent=MASTER.slice(0,3)+' \u2022\u2022\u2022\u2022\u2022\u2022\u2022 '+MASTER.slice(-2);
const msg=e=>({'auth/invalid-verification-code':'Wrong OTP. Try again.','auth/code-expired':'OTP expired. Send a new one.','auth/too-many-requests':'Too many tries. Wait a while.','not-master':'This number is not allowed.','auth/billing-not-enabled':'Phone OTP needs the Blaze plan.'}[e&&e.code]||'Could not sign in ('+((e&&e.code)||'error')+').');
const show=(id,on)=>$(id).classList.toggle('hide',!on);
function lock(m){logout();ALL=null;SEL.clear();show('room',false);show('bar',false);show('login',true);show('s1',true);show('s2',false);$('otp').value='';$('le').textContent=m||''}
function touch(){clearTimeout(idle);idle=setTimeout(()=>lock('Logged out after 10 minutes of no activity.'),600000)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>ALL&&touch()));
$('send').onclick=async()=>{$('le').textContent='';if(/X/.test(MASTER)){$('le').textContent='Master number is not set in this file.';return}
  $('send').disabled=true;try{await sendOtp();show('s1',false);show('s2',true)}catch(e){$('le').textContent=msg(e)}$('send').disabled=false};
$('ver').onclick=async()=>{$('le').textContent='';$('ver').disabled=true;try{await verifyOtp($('otp').value.trim());await load();show('login',false);show('room',true);show('bar',true);touch()}catch(e){$('le').textContent=msg(e)}$('ver').disabled=false};
$('out').onclick=()=>lock();
async function load(){ALL=await fetchAll();SEL.clear();draw()}
function items(){const A=ALL,cn=Object.fromEntries(A.customers.map(c=>[c.id,c.name])),ln=Object.fromEntries(A.loans.map(l=>[l.id,l.loanNo])),o=[];
  A.customers.filter(c=>c.deleted).forEach(c=>o.push({col:'customers',t:'Customer',id:c.id,d:c,h:`<b>${esc(c.name)}</b><br>${esc(c.phone)} \u00b7 ${esc(c.address)}`}));
  A.loans.filter(l=>l.deleted).forEach(l=>o.push({col:'loans',t:'Loan',id:l.id,qk:l.qk,d:l,h:`<b>${LID(l.loanNo)}</b> \u00b7 ${inr(l.amount)}<br>${esc(cn[l.cid]||'?')}`}));
  A.payments.forEach(p=>o.push({col:'payments',t:'Payment',id:p.id,d:p,h:`<b>${inr(p.amount)}</b> \u00b7 ${esc(p.date)}<br>${ln[p.lid]?'Loan '+LID(ln[p.lid]):'Loan ?'} \u00b7 ${esc(cn[p.cid]||'?')}`}));
  A.proofs.forEach(x=>o.push({col:'proofs',t:'Proof',id:x.id,d:x,h:`<b>${esc(x.type)}</b> document<br>${esc(cn[x.cid]||'?')}`}));
  return o.sort((a,b)=>(b.d.deletedAt||0)-(a.d.deletedAt||0))}
const key=i=>i.col+'/'+i.id;
function draw(){IT=items();const T=['all','Customer','Loan','Payment','Proof'];
  $('chips').innerHTML=T.map(t=>`<span class="chip ${FLT===t?'on':''}" data-f="${t}">${t==='all'?'All':t+'s'} ${t==='all'?IT.length:IT.filter(i=>i.t===t).length}</span>`).join('');
  const v=IT.filter(i=>FLT==='all'||i.t===FLT);
  $('cnt').textContent=v.length?'':'Nothing here. No deleted entries.';
  $('list').innerHTML=v.map(i=>`<label class="row"><input type="checkbox" data-k="${esc(key(i))}" ${SEL.has(key(i))?'checked':''}><div><span class="tag">${i.t}</span><div style="margin-top:4px">${i.h}</div><div class="m" style="margin-top:4px">Deleted ${fd(i.d.deletedAt)} by ${esc(i.d.deletedByName||'?')}${i.d.reason?' \u00b7 '+esc(i.d.reason):''}${i.d.via?' \u00b7 with '+esc(i.d.via):''}</div></div></label>`).join('');
  $('del').disabled=!SEL.size;$('del').textContent=SEL.size?`Delete permanently (${SEL.size})`:'Delete permanently'}
$('chips').onclick=e=>{const f=e.target.dataset.f;if(f){FLT=f;draw()}};
$('list').onchange=e=>{const k=e.target.dataset.k;if(k){e.target.checked?SEL.add(k):SEL.delete(k);draw()}};
$('all').onclick=()=>{IT.filter(i=>FLT==='all'||i.t===FLT).forEach(i=>SEL.add(key(i)));draw()};
$('none').onclick=()=>{SEL.clear();draw()};
$('del').onclick=()=>{$('cm').textContent=`${SEL.size} entr${SEL.size>1?'ies':'y'} will be removed for good. A backup file downloads first. Type DELETE to confirm. Related entries (like a customer's loans) are removed only if you selected them.`;$('ct').value='';$('cy').disabled=true;$('ce').textContent='';show('cf',true)};
$('ct').oninput=()=>$('cy').disabled=$('ct').value!=='DELETE';
$('cn').onclick=()=>show('cf',false);
$('cy').onclick=async()=>{const pick=IT.filter(i=>SEL.has(key(i)));$('cy').disabled=true;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pick.map(i=>({col:i.col,id:i.id,...i.d})),null,1)],{type:'application/json'}));a.download='deleted-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
    await purge(pick);show('cf',false);await load()}catch(e){$('ce').textContent='Could not delete ('+((e&&e.code)||'error')+').';$('cy').disabled=false}};
</script></body></html>
